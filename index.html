<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 قیمت‌یاب من</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛒 قیمت‌یاب من</h1>
            <p>مقایسه آسان قیمت‌های محصولات از سایت‌های مختلف</p>
        </header>

        <div class="add-section">
            <input type="text" id="productName" placeholder="نام محصول (مثلاً: میکسر بوش)" class="input-field">
            <input type="url" id="productUrl" placeholder="لینک محصول" class="input-field">
            <button onclick="addProduct()" class="btn btn-primary">➕ اضافه کردن</button>
        </div>

        <div class="actions">
            <button onclick="updateAllPrices()" class="btn btn-update" id="updateBtn">🔄 بروزرسانی همه</button>
            <button onclick="exportToCSV()" class="btn btn-export">📊 دانلود Excel</button>
            <button onclick="clearAll()" class="btn btn-danger">🗑️ پاک کردن همه</button>
        </div>

        <div class="stats" id="stats" style="display:none;">
            <div class="stat-item">
                <span class="stat-label">تعداد محصولات:</span>
                <span id="productCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">آخرین بروزرسانی:</span>
                <span id="lastUpdate">هرگز</span>
            </div>
        </div>

        <div class="products-table">
            <table id="productsTable">
                <thead>
                    <tr>
                        <th>نام محصول</th>
                        <th>سایت</th>
                        <th>قیمت (تومان)</th>
                        <th>وضعیت</th>
                        <th>زمان</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="productsBody">
                    <!-- محصولات اینجا اضافه می‌شن -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-state">
                <p>🛍️ هنوز محصولی اضافه نکرده‌اید</p>
                <p>لینک محصولات مورد نظرتان را اضافه کنید</p>
            </div>
        </div>

        <div id="loadingModal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="loader"></div>
                <p>در حال بروزرسانی قیمت‌ها...</p>
                <div id="loadingProgress"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>ساخته شده با ❤️ برای مقایسه آسان قیمت‌ها</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
